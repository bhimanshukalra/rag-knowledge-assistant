[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "company-knowledge-assistant"
version = "0.1.0"
description = "A project-based learning repository for building a serious RAG system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.0.0",
    "langchain-core>=0.3.86",
    "langchain-google-genai>=2.1.12",
    "python-dotenv>=1.2.1",
    "scikit-learn>=1.6.1",
    "flashrank>=0.2.10",
]

[tool.setuptools]
py-modules = ["rag"]

[tool.pytest.ini_options]
pythonpath = ["."]
