[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "company-knowledge-assistant"
version = "0.1.0"
description = "A project-based learning repository for building a serious RAG system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.30",
    "langchain-community>=0.3.31",
    "langchain-core>=0.3.86",
    "langchain-google-genai>=2.1.12",
    "python-dotenv>=1.2.1",
    "scikit-learn>=1.6.1",
]

[tool.setuptools]
py-modules = ["rag"]

[tool.pytest.ini_options]
pythonpath = ["."]
